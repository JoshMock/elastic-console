[package]
name = "elastic-console"
version = "0.1.0"
edition = "2024"

[dependencies]
tree-sitter = "0.25"
# Local clone of the grammar (cargo does not expand ~, so the path is relative)
tree-sitter-elasticsearch-console = { path = "../elastic-neovim/tree-sitter-elasticsearch-console" }
# ureq with rustls for pure-Rust TLS (ring crypto, webpki roots)
ureq = { version = "3", default-features = false, features = ["rustls"] }
reedline = "0.52"
nu-ansi-term = "0.50"
serde_json = "1"
base64 = "0.22"
