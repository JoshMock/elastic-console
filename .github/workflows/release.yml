name: Release

on:
  push:
    branches: [main]

permissions: {}

env:
  # The grammar is a path dependency on ../elastic-neovim/tree-sitter-elasticsearch-console
  # (see Cargo.toml), so it is checked out next to this repo. Pinned to a main commit.
  # Keep in sync with GRAMMAR_REF in ci.yml.
  GRAMMAR_REF: 18c9905e72c9645be787ec176f586024d5b52e00

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Builds run in this workflow rather than on `release: published`: a release created
  # with GITHUB_TOKEN does not trigger new workflow runs.
  build:
    name: Build ${{ matrix.asset }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: elastic-console-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: elastic-console-linux-arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: elastic-console-darwin-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: elastic-console-darwin-amd64
            cross: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: elastic-console-windows-amd64.exe
    defaults:
      run:
        shell: bash
        working-directory: elastic-repl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: elastic-repl
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: elastic/tree-sitter-elasticsearch-console
          ref: ${{ env.GRAMMAR_REF }}
          # The grammar repo is private: a fine-grained token with read access to it.
          token: ${{ secrets.GRAMMAR_REPO_TOKEN }}
          path: elastic-neovim/tree-sitter-elasticsearch-console
          persist-credentials: false

      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Test
        if: ${{ !matrix.cross }}
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --target "$TARGET"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          bin="target/$TARGET/release/elastic-console"
          [[ "$ASSET" == *.exe ]] && bin="$bin.exe"
          cp "$bin" "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

  # The binaries bundle the Apache-2.0 tree-sitter grammar, whose license requires
  # shipping its LICENSE and NOTICE with redistributions (sections 4a and 4d).
  finalize:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: elastic/tree-sitter-elasticsearch-console
          ref: ${{ env.GRAMMAR_REF }}
          token: ${{ secrets.GRAMMAR_REPO_TOKEN }}
          path: grammar
          persist-credentials: false

      - name: Upload SHA256SUMS and third-party notices
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'elastic-console-*'
          sha256sum elastic-console-* > SHA256SUMS
          cp grammar/LICENSE tree-sitter-elasticsearch-console.LICENSE
          cp grammar/NOTICE.txt tree-sitter-elasticsearch-console.NOTICE.txt
          gh release upload "$TAG" SHA256SUMS tree-sitter-elasticsearch-console.LICENSE \
            tree-sitter-elasticsearch-console.NOTICE.txt --clobber --repo "$GITHUB_REPOSITORY"
